name: AkiyaFind Crawler

on:
  workflow_dispatch:
    inputs:
      prefectures:
        description: 'Prefecture codes (space-separated, blank = all 47)'
        required: false
        default: ''
      start_from:
        description: 'Resume from prefecture index (0-based)'
        required: false
        default: '0'
  schedule:
    - cron: '0 17 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests psycopg2-binary beautifulsoup4
      - name: Run crawler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Scheduled runs have no inputs, so fall back to the dispatch defaults.
          PREFECTURES: ${{ github.event.inputs.prefectures || '' }}
          START_FROM: ${{ github.event.inputs.start_from || '0' }}
        run: |
          ARGS=""
          if [ -n "$PREFECTURES" ]; then ARGS="--prefectures $PREFECTURES"; fi
          if [ "$START_FROM" != "0" ]; then ARGS="$ARGS --start-from $START_FROM"; fi
          python3 crawler_v3.py $ARGS

      - name: Send saved-search email alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: python3 alerts.py
