name: Delete At Home data

# One-off: At Home asked us (29 Oct 2026) to stop showing listings and photos
# taken from akiya-athome.jp. The site already hides them; this permanently
# deletes the copies from the database. Run it from the Actions tab and type
# DELETE to confirm. Running it again does nothing.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to permanently remove every listing copied from akiya-athome.jp'
        required: true

concurrency:
  group: akiyafind-database
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DELETE" ]; then
            echo "Nothing deleted: you typed '$CONFIRM', not DELETE."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install psycopg2-binary
      - name: Delete At Home listings and crawl history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: python
        run: |
          import os
          import psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          cur = conn.cursor()
          # Crawled rows are the ones not mirrored from an agent listing.
          cur.execute("DELETE FROM listings WHERE agent_listing_id IS NULL")
          deleted = cur.rowcount
          cur.execute("DROP TABLE IF EXISTS crawl_log")
          cur.execute("SELECT COUNT(*) FROM listings")
          left = cur.fetchone()[0]
          conn.commit()
          print(f"Deleted {deleted} listings copied from At Home. {left} agent listings remain.")
